<!-- Login Form Card -->
<div class="login-card w-full rounded-xl p-6 flex flex-col gap-stack-gap">
<form class="flex flex-col gap-stack-gap" id="loginForm" onsubmit="event.preventDefault();">
<!-- Email/Username Field -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="username">
                        Username or Email
                    </label>
<div class="input-well flex items-center h-touch-target-min rounded-lg px-4 gap-element-gap">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">person</span>
<input class="bg-transparent border-none focus:ring-0 text-on-surface font-body-md text-body-md w-full placeholder:text-outline p-0" id="username" placeholder="e.g. alex.smith@university.edu" required="" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="password">
                        Password
                    </label>
<div class="input-well flex items-center h-touch-target-min rounded-lg px-4 gap-element-gap">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">lock</span>
<input class="bg-transparent border-none focus:ring-0 text-on-surface font-body-md text-body-md w-full placeholder:text-outline p-0" id="password" placeholder="••••••••" required="" type="password"/>
<button class="text-on-surface-variant hover:text-primary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="passIcon">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end">
<a class="font-label-sm text-label-sm text-secondary hover:text-primary-fixed transition-colors active:scale-95 duration-150" href="#">
                        Forgot Password?
                    </a>
</div>
<!-- Action Button -->
<button class="bg-primary-container hover:bg-primary text-on-primary-container font-headline-md text-headline-md h-[52px] rounded-lg transition-all active:scale-[0.98] shadow-sm flex items-center justify-center gap-element-gap mt-2" type="submit">
                    Login
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
  <script src="script.js"></script>
</form>
</div>
<!-- Footer / Sign Up Prompt -->
<div class="mt-stack-gap text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                New to the platform? 
              <a class="text-primary font-semibold hover:underline" href="signup.html">
    Create Account
</a>
</p>
</div>
</main>
<script>
        // Micro-interaction for password visibility
        function togglePassword() {
            const passInput = document.getElementById('password');
            const passIcon = document.getElementById('passIcon');
            
            if (passInput.type === 'password') {
                passInput.type = 'text';
                passIcon.textContent = 'visibility_off';
            } else {
                passInput.type = 'password';
                passIcon.textContent = 'visibility';
            }
        }

        // Add a subtle parallax effect to the background glow on mouse move
        document.addEventListener('mousemove', (e) => {
            const glows = document.querySelectorAll('.ambient-glow');
            const x = (e.clientX / window.innerWidth) - 0.5;
            const y = (e.clientY / window.innerHeight) - 0.5;

            glows.forEach((glow, index) => {
                const speed = (index + 1) * 20;
                glow.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
            });
        });
    </script>
