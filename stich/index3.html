<!-- Micro-interactions Script -->
<script>
        // Segmented Control Logic
        const genderButtons = document.querySelectorAll('.bg-surface-container-highest button');
        genderButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                genderButtons.forEach(b => {
                    b.classList.remove('bg-primary-container', 'text-on-primary-container');
                    b.classList.add('text-on-surface-variant');
                });
                btn.classList.add('bg-primary-container', 'text-on-primary-container');
                btn.classList.remove('text-on-surface-variant');
            });
        });
document.addEventListener('DOMContentLoaded', () => {
  const classSelect = document.querySelector('select');
  const armContainer = document.getElementById('armContainer');

  classSelect.addEventListener('change', () => {
    if (classSelect.value !== "") {
      armContainer.classList.remove('hidden');
    } else {
      armContainer.classList.add('hidden');
    }
  });
});
        // Simple button active state visual
        const saveBtn = document.getElementById('saveButton');
        saveBtn.addEventListener('click', (e) => {
            e.preventDefault();
            saveBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Saving...';
    setTimeout(() => {
    saveBtn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Saved Successfully';

    setTimeout(() => {
        window.location.href = 'index2.html';
    }, 1500);

}, 1500);
        });

        // Photo Upload Mock
        const uploadArea = document.querySelector('.group.cursor-pointer');
        uploadArea.addEventListener('click', () => {
            const preview = document.getElementById('profilePreview');
            const placeholder = document.getElementById('uploadPlaceholder');
            preview.classList.toggle('hidden');
            placeholder.classList.toggle('hidden');
        });
    </script>
